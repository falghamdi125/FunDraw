name: Build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, needed to work out the version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Version for this commit:
      #  - if the commit is already tagged vX.Y.Z, use that
      #  - otherwise take the newest vX.Y.Z tag and add 1 to the patch number
      #  - with no tags at all, use the version in package.json
      - name: Work out version
        id: version
        shell: bash
        run: |
          exact=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$exact" ]; then
            v="${exact#v}"
          else
            last=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -n "$last" ]; then
              IFS=. read -r major minor patch <<< "${last#v}"
              v="$major.$minor.$((patch + 1))"
            else
              v=$(node -p "require('./package.json').version")
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building FunDraw $v"

      - run: npm ci

      - name: Set version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build MSI
        run: npx electron-builder --win msi --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: FunDraw-${{ steps.version.outputs.version }}
          path: dist/*.msi

      # Every push to master becomes a tagged GitHub release with the installer attached
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FunDraw ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.msi
          generate_release_notes: true
